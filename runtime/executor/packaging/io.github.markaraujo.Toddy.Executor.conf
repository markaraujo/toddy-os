<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="io.github.markaraujo.Toddy.Executor"/>
    <allow send_destination="io.github.markaraujo.Toddy.Executor" send_interface="io.github.markaraujo.Toddy.Executor1"/>
  </policy>
  <policy user="root"><allow own="io.github.markaraujo.Toddy.Executor"/></policy>
</busconfig>
