<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/toddy-executor-test-bus</listen>
  <auth>EXTERNAL</auth>
  <limit name="max_message_size">1048576</limit>
  <limit name="max_connections_per_user">16</limit>
  <policy context="default">
    <allow user="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <deny own="*"/>
  </policy>
  <policy user="root"><allow own="io.github.markaraujo.Toddy.Executor"/></policy>
</busconfig>
