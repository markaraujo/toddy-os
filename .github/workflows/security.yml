name: Public repository safety
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-content-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-content:
    name: public-content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and verify the pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/toddy-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
      - name: Scan history without printing secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/toddy-gitleaks"
          printf '[extend]\nuseDefault = true\n' > "$scanner_dir/config.toml"
          if [ "$EVENT_NAME" = pull_request ]; then
            # A fork cannot exempt its own findings by editing the ignore list.
            git show origin/main:.gitleaksignore > "$scanner_dir/approved-ignore"
          else
            cp .gitleaksignore "$scanner_dir/approved-ignore"
          fi
          if ! "$scanner_dir/gitleaks" git \
            --config "$scanner_dir/config.toml" \
            --gitleaks-ignore-path "$scanner_dir/approved-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --timeout 120 \
            --report-format json --report-path "$scanner_dir/report.json" \
            --log-opts=--all . > "$scanner_dir/scan.log" 2>&1; then
            echo '::error::Sensitive-content scan failed. Review locally with redaction; never paste secret values into a public issue or log.'
            exit 1
          fi
          echo 'Pinned Gitleaks history scan passed with the reviewed exceptions.'
