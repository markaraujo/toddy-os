name: Planning consistency
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: planning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate planning, links and progress gates
        run: make check
